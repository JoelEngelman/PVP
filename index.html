<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVP — Arena Rush</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101b;color:#fff;font-family:Inter,Arial,sans-serif}canvas{display:block;width:100%;height:100%;cursor:crosshair}.hidden{display:none!important}.screen{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 35%,#19385a,#091424 45%,#040810);display:flex;align-items:center;justify-content:center}.panel{width:min(900px,92vw);max-height:90vh;overflow:auto;padding:34px;border:1px solid #ffffff1e;border-radius:28px;background:#091321ed;box-shadow:0 30px 100px #000b}.brand{font-size:64px;font-weight:1000;letter-spacing:8px;text-align:center;background:linear-gradient(90deg,#5ee7ff,#a77cff,#ff619e);color:transparent;background-clip:text}.tag{text-align:center;opacity:.5;letter-spacing:5px;font-size:11px}.nav{display:flex;gap:10px;justify-content:center;margin:26px 0}.btn{border:1px solid #ffffff1c;background:#ffffff0d;color:white;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(90deg,#47cfff,#7d70ff);border:0}.btn:hover{filter:brightness(1.15)}.homegrid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.box{background:#ffffff08;border:1px solid #ffffff12;border-radius:18px;padding:20px}.box h2{margin:0 0 12px}.stats{display:flex;gap:12px}.stat{flex:1;background:#0004;border-radius:12px;padding:14px}.stat b{display:block;font-size:22px}.weapons,.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.weaponCard{padding:16px;border-radius:15px;background:#101d30;border:1px solid #ffffff12}.weaponCard.locked{opacity:.55}.weaponCard h3{margin:0 0 6px}.small{font-size:12px;opacity:.55;line-height:1.5}.hud{position:fixed;inset:0;z-index:3;pointer-events:none}.top{position:absolute;left:20px;right:20px;top:18px;display:flex;justify-content:space-between}.hudbrand{font-weight:1000;font-size:24px;letter-spacing:4px}.score{text-align:right;font-weight:1000;font-size:25px}.health{height:10px;width:210px;background:#ffffff18;border-radius:9px;overflow:hidden;margin-top:7px}.health i{display:block;height:100%;background:#5df38d;width:100%}.bottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}.hotbar{display:flex;padding:6px;border-radius:14px;background:#07101ddd;border:1px solid #ffffff2a;box-shadow:0 15px 45px #0008;pointer-events:auto}.slot{width:72px;height:66px;border:1px solid #ffffff16;border-radius:9px;margin:2px;background:#ffffff08;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer}.slot.active{border:2px solid #fff;background:#ffffff18;box-shadow:0 0 20px #69ddff33}.slot .num{position:absolute;top:4px;left:6px;font-size:10px;opacity:.55}.slot .icon{font-size:24px}.slot .name{font-size:8px;font-weight:900;max-width:65px;overflow:hidden;white-space:nowrap}.ammo{font-weight:1000;font-size:18px}.tips{font-size:10px;opacity:.45}.cross{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);z-index:4;pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{left:10px;width:2px;height:22px}.cross:after{top:10px;width:22px;height:2px}.toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:20;background:#081321ee;border:1px solid #ffffff22;border-radius:12px;padding:12px 18px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:700px){.homegrid,.weapons,.shopgrid{grid-template-columns:1fr}.brand{font-size:45px}.slot{width:58px}.panel{padding:22px}}</style></head><body>
<canvas id="game"></canvas><div class="hud hidden" id="hud"><div class="top"><div class="hudbrand">PVP</div><div><div class="score" id="score">000000</div><div class="health"><i id="hp"></i></div></div></div><div class="cross"></div><div class="bottom"><div class="hotbar" id="hotbar"></div><div class="ammo" id="ammo">18 / 18</div><div class="tips">WASD / ARROWS MOVE · SHIFT SPRINT · SPACE DASH · CLICK FIRE · R RELOAD · 1 2 3 SELECT</div></div></div>
<div class="screen" id="home"><div class="panel"><div class="brand">PVP</div><div class="tag">ARENA RUSH</div><div class="nav"><button class="btn primary" onclick="showHome()">HOME</button><button class="btn" onclick="showShop()">SHOP</button><button class="btn" onclick="startGame()">PLAY</button></div><div id="homeContent"></div></div></div>
<div class="screen hidden" id="shop"><div class="panel"><div class="brand" style="font-size:48px">WEAPON SHOP</div><div class="small" style="text-align:center;margin:8px 0 22px">Buy weapons and upgrade them. Coins are earned from eliminations.</div><div class="shopgrid" id="shopGrid"></div><div style="text-align:center;margin-top:20px"><button class="btn" onclick="showHome()">BACK HOME</button></div></div></div><div class="toast" id="toast"></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const weapons={1:{name:'VOLT SMG',icon:'⚡',base:10,rate:150,max:18,color:'#55e5ff',cost:0},2:{name:'BLAZE',icon:'🔥',base:25,rate:480,max:6,color:'#ff9a55',cost:250},3:{name:'SHOCK',icon:'✦',base:52,rate:900,max:3,color:'#c888ff',cost:650}};let owned={1:true,2:false,3:false},upgrades={1:0,2:0,3:0},coins=0,best=0,selected=1,ammo=18,reloadTime=0,running=false,player=null,bullets=[],enemies=[],particles=[],pickups=[],spawnTimer=0,score=0,dashCD=0,mouse={x:W/2,y:H/2,down:false},keys=new Set(),world={w:4200,h:3000,walls:[]},cam={x:0,y:0};
function stats(id){let w=weapons[id],u=upgrades[id];return{damage:w.base+u*5,rate:Math.max(70,w.rate-u*14),max:w.max+u*2,speed:id===1?16:id===2?13:10}}function save(){localStorage.setItem('pvpSave',JSON.stringify({owned,upgrades,coins,best}))}try{let s=JSON.parse(localStorage.getItem('pvpSave'));if(s){owned=s.owned||owned;upgrades=s.upgrades||upgrades;coins=s.coins||0;best=s.best||0}}catch(e){}
function showHome(){running=false;document.getElementById('hud').classList.add('hidden');document.getElementById('shop').classList.add('hidden');document.getElementById('home').classList.remove('hidden');document.getElementById('homeContent').innerHTML='<div class="homegrid"><div class="box"><h2>READY FOR BATTLE?</h2><p class="small">A huge scrolling arena with more breathing room, slower enemies and fewer enemy shots.</p><button class="btn primary" onclick="startGame()" style="width:100%">ENTER ARENA</button></div><div class="box"><h2>PROFILE</h2><div class="stats"><div class="stat"><span class="small">COINS</span><b>🪙 '+coins+'</b></div><div class="stat"><span class="small">BEST</span><b>'+best+'</b></div></div></div></div><div class="box" style="margin-top:16px"><h2>ARSENAL</h2><div class="weapons">'+Object.keys(weapons).map(id=>'<div class="weaponCard '+(owned[id]?'':'locked')+'"><h3>'+weapons[id].icon+' '+weapons[id].name+'</h3><div class="level">LEVEL '+(upgrades[id]+1)+'</div><p class="small">'+stats(id).damage+' damage · '+stats(id).max+' ammo</p></div>').join('')+'</div></div>'}function showShop(){running=false;document.getElementById('home').classList.add('hidden');document.getElementById('shop').classList.remove('hidden');renderShop()}function renderShop(){document.getElementById('shopGrid').innerHTML=Object.keys(weapons).map(id=>{let w=weapons[id],s=stats(id),u=upgrades[id];return '<div class="box"><div style="font-size:38px">'+w.icon+'</div><h2>'+w.name+'</h2><p class="small">Level '+(u+1)+'<br>Damage '+s.damage+'<br>Magazine '+s.max+'</p><button class="btn primary" onclick="'+(owned[id]?'upgrade('+id+')':'buyWeapon('+id+')')+'">'+(owned[id]?'UPGRADE · 🪙 '+(100+u*125):'BUY · 🪙 '+w.cost)+'</button></div>'}).join('')}function buyWeapon(id){if(coins<weapons[id].cost)return toast('Not enough coins');coins-=weapons[id].cost;owned[id]=true;save();renderShop();toast('Weapon unlocked!')}function upgrade(id){let cost=100+upgrades[id]*125;if(coins<cost)return toast('Not enough coins');coins-=cost;upgrades[id]++;save();renderShop();toast('Weapon upgraded!')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)}
function makeHotbar(){let h=document.getElementById('hotbar');h.innerHTML=Object.keys(weapons).map(id=>'<div class="slot '+(+id===selected?'active':'')+'" onclick="equip('+id+')" style="opacity:'+(owned[id]?1:.35)+'"><span class="num">'+id+'</span><span class="icon">'+weapons[id].icon+'</span><span class="name">'+(owned[id]?weapons[id].name:'LOCKED')+'</span></div>').join('')}function equip(id){if(!owned[id])return toast('Buy it in the Shop');selected=id;ammo=stats(id).max;reloadTime=0;makeHotbar();sync()}
function startGame(){document.getElementById('home').classList.add('hidden');document.getElementById('shop').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');world={w:4200,h:3000,walls:[]};player={x:2100,y:1500,r:18,hp:100,last:0};cam={x:player.x-W/2,y:player.y-H/2};score=0;ammo=stats(selected).max;reloadTime=0;dashCD=0;bullets=[];enemies=[];particles=[];pickups=[];spawnTimer=900;makeWalls();for(let i=0;i<6;i++)spawnEnemy();running=true;sync()}
function makeWalls(){for(let i=0;i<34;i++){let x=180+Math.random()*(world.w-360),y=180+Math.random()*(world.h-360);if(Math.hypot(x-2100,y-1500)<480)continue;world.walls.push({x,y,w:110+Math.random()*180,h:24+Math.random()*42})}}
function spawnEnemy(){let side=Math.floor(Math.random()*4),x=side===0?70:side===1?world.w-70:Math.random()*(world.w-140)+70,y=side===2?70:side===3?world.h-70:Math.random()*(world.h-140)+70;if(Math.hypot(x-player.x,y-player.y)<650)return;let tank=Math.random()<.1;enemies.push({x,y,r:tank?24:15,hp:tank?90:35,max:tank?90:35,speed:tank?.48:.62+Math.random()*.2,cd:1500+Math.random()*1200,tank})}
function solid(x,y,r){return world.walls.some(w=>x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)}function movePlayer(dx,dy){let l=Math.hypot(dx,dy);if(!l)return;dx/=l;dy/=l;let sp=keys.has('ShiftLeft')||keys.has('ShiftRight')?4.8:3.2,nx=Math.max(25,Math.min(world.w-25,player.x+dx*sp)),ny=Math.max(25,Math.min(world.h-25,player.y+dy*sp));if(!solid(nx,player.y,player.r))player.x=nx;if(!solid(player.x,ny,player.r))player.y=ny}function wallLine(x1,y1,x2,y2){let n=Math.ceil(Math.hypot(x2-x1,y2-y1)/10);for(let i=1;i<=n;i++){let t=i/n;if(solid(x1+(x2-x1)*t,y1+(y2-y1)*t,2))return true}return false}function wx(){return mouse.x+cam.x}function wy(){return mouse.y+cam.y}
function shoot(){let s=stats(selected),now=performance.now();if(reloadTime||ammo<=0||now-player.last<s.rate)return;let a=Math.atan2(wy()-player.y,wx()-player.x);player.last=now;ammo--;bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*s.speed,vy:Math.sin(a)*s.speed,damage:s.damage,life:1100,c:weapons[selected].color,enemy:false});burst(player.x+Math.cos(a)*24,player.y+Math.sin(a)*24,weapons[selected].color,5);if(!ammo)startReload();sync()}function startReload(){if(!reloadTime&&ammo<stats(selected).max)reloadTime=650}function dash(){if(!running||dashCD>0)return;let dx=(keys.has('KeyD')||keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('a')||keys.has('ArrowLeft')?1:0),dy=(keys.has('KeyS')||keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('w')||keys.has('ArrowUp')?1:0);if(!dx&&!dy)return;let l=Math.hypot(dx,dy);dx/=l;dy/=l;for(let i=0;i<18;i++){let nx=player.x+dx*10,ny=player.y+dy*10;if(solid(nx,ny,player.r))break;player.x=nx;player.y=ny}dashCD=1000;burst(player.x,player.y,'#fff',20)}function burst(x,y,c,n=10){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:250+Math.random()*450,c})}function sync(){document.getElementById('ammo').textContent=reloadTime?'RELOADING':ammo+' / '+stats(selected).max;document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('hp').style.width=Math.max(0,player?player.hp:100)+'%';makeHotbar()}
function update(dt){if(!running)return;let dx=(keys.has('KeyD')||keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('a')||keys.has('ArrowLeft')?1:0),dy=(keys.has('KeyS')||keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('w')||keys.has('ArrowUp')?1:0);movePlayer(dx,dy);if(mouse.down)shoot();if(reloadTime){reloadTime-=dt;if(reloadTime<=0){ammo=stats(selected).max;reloadTime=0}}dashCD=Math.max(0,dashCD-dt);cam.x+=(player.x-W/2-cam.x)*.1;cam.y+=(player.y-H/2-cam.y)*.1;cam.x=Math.max(0,Math.min(world.w-W,cam.x));cam.y=Math.max(0,Math.min(world.h-H,cam.y));for(let b of bullets){let nx=b.x+b.vx*dt/16,ny=b.y+b.vy*dt/16;if(wallLine(b.x,b.y,nx,ny)){b.life=0;burst(b.x,b.y,'#aaa',5);continue}b.x=nx;b.y=ny;b.life-=dt;if(!b.enemy){for(let e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5&&b.life>0){b.life=0;e.hp-=b.damage;burst(b.x,b.y,b.c,7);if(e.hp<=0){score+=e.tank?180:80;coins+=e.tank?25:10;burst(e.x,e.y,e.tank?'#ff5470':'#58e5ff',28);if(Math.random()<.14)pickups.push({x:e.x,y:e.y,life:8000});enemies.splice(enemies.indexOf(e),1);save();break}}}}else if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+4){b.life=0;player.hp-=b.damage;burst(player.x,player.y,'#ff5277',8)}}bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.y>0&&b.x<world.w&&b.y<world.h);for(let e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x),d=Math.hypot(player.x-e.x,player.y-e.y),nx=e.x+Math.cos(a)*e.speed*dt/16,ny=e.y+Math.sin(a)*e.speed*dt/16;if(!solid(nx,e.y,e.r))e.x=nx;if(!solid(e.x,ny,e.r))e.y=ny;e.cd-=dt;if(d<e.r+player.r)player.hp-=.045*dt/16;if(e.cd<=0&&d<700){e.cd=1600+Math.random()*1200;let aa=a+(Math.random()-.5)*.1,tx=e.x+Math.cos(aa)*800,ty=e.y+Math.sin(aa)*800;if(!wallLine(e.x,e.y,tx,ty))bullets.push({x:e.x,y:e.y,vx:Math.cos(aa)*5,vy:Math.sin(aa)*5,damage:e.tank?8:4,life:1800,c:'#ff5577',enemy:true})}}for(let p of pickups){p.life-=dt;if(Math.hypot(p.x-player.x,p.y-player.y)<30){player.hp=Math.min(100,player.hp+28);p.life=0;burst(p.x,p.y,'#61ff98',18)}}pickups=pickups.filter(p=>p.life>0);spawnTimer-=dt;if(spawnTimer<=0&&enemies.length<Math.min(11,5+Math.floor(score/450))){spawnEnemy();spawnTimer=1200}for(let p of particles){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vx*=.97;p.vy*=.97;p.life-=dt}particles=particles.filter(p=>p.life>0);sync();if(player.hp<=0){running=false;best=Math.max(best,score);save();showHome();toast('RUN OVER · SCORE '+score)}}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));g.addColorStop(0,'#18395b');g.addColorStop(1,'#040911');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#091727';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#ffffff09';for(let x=0;x<world.w;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}for(let w of world.walls){ctx.fillStyle='#182b40';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle='#4b7c99';ctx.strokeRect(w.x,w.y,w.w,w.h)}for(let p of pickups){ctx.fillStyle='#61ff98';ctx.shadowBlur=20;ctx.shadowColor='#61ff98';ctx.beginPath();ctx.arc(p.x,p.y,12+Math.sin(performance.now()/100)*3,0,6.28);ctx.fill();ctx.shadowBlur=0}for(let b of bullets){ctx.fillStyle=b.c;ctx.shadowBlur=12;ctx.shadowColor=b.c;ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.28);ctx.fill();ctx.shadowBlur=0}for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.atan2(player.y-e.y,player.x-e.x));ctx.fillStyle=e.tank?'#e24662':'#ff4d91';ctx.shadowBlur=18;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.moveTo(e.r+6,0);ctx.lineTo(-e.r*.7,-e.r*.8);ctx.lineTo(-e.r*.7,e.r*.8);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(1,-3,9,6);ctx.restore();ctx.fillStyle='#0009';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle='#5df38d';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*(e.hp/e.max),4)}if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.atan2(wy()-player.y,wx()-player.x));ctx.shadowBlur=25;ctx.shadowColor=weapons[selected].color;ctx.fillStyle='#e3edf7';ctx.beginPath();ctx.arc(0,0,18,0,6.28);ctx.fill();ctx.fillStyle='#24344b';ctx.fillRect(-10,-12,18,24);ctx.fillStyle=weapons[selected].color;ctx.fillRect(7,-4,28,8);ctx.restore()}for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/500);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;ctx.strokeStyle='#3d718d';ctx.strokeRect(0,0,world.w,world.h);ctx.restore()}
addEventListener('keydown',e=>{keys.add(e.code);keys.add(e.key.toLowerCase());if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')dash();if(e.key.toLowerCase()==='r')startReload();if('123'.includes(e.key))equip(+e.key)});addEventListener('keyup',e=>{keys.delete(e.code);keys.delete(e.key.toLowerCase())});addEventListener('blur',()=>{keys.clear();mouse.down=false});addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});
let last=performance.now();function loop(t){let dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}showHome();requestAnimationFrame(loop);
</script></body></html>
