<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVP Arena</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07101c;color:#fff;font-family:Arial,sans-serif}button{font:inherit}canvas{display:block;width:100%;height:100%;cursor:crosshair}.screen{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 35%,#173b60,#07101c 70%);display:flex;align-items:center;justify-content:center}.hide{display:none!important}.panel{width:min(900px,92vw);max-height:90vh;overflow:auto;padding:36px;border:1px solid #ffffff22;border-radius:28px;background:#091522f5;box-shadow:0 30px 100px #000}.logo{text-align:center;font-size:68px;font-weight:900;letter-spacing:9px;background:linear-gradient(90deg,#53e7ff,#987cff,#ff5e9d);color:transparent;background-clip:text}.tag{text-align:center;opacity:.5;letter-spacing:5px;font-size:11px}.nav{display:flex;justify-content:center;gap:10px;margin:25px 0}.btn{border:1px solid #ffffff20;background:#ffffff0d;color:#fff;border-radius:12px;padding:13px 22px;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.25);transform:translateY(-1px)}.primary{background:linear-gradient(90deg,#45cfff,#7c6cff);border:0}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.box{background:#ffffff08;border:1px solid #ffffff12;border-radius:17px;padding:19px}.box h2{margin:0 0 10px}.muted{opacity:.55;font-size:12px;line-height:1.5}.stats{display:flex;gap:10px}.stat{flex:1;background:#0004;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px;margin-top:5px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#101e31;border:1px solid #ffffff14;border-radius:15px;padding:16px}.card h3{margin:8px 0}.card .icon{font-size:34px}.hud{position:fixed;inset:0;z-index:3;pointer-events:none}.top{position:absolute;left:20px;right:20px;top:18px;display:flex;justify-content:space-between}.score{font-size:26px;font-weight:900;text-align:right}.health{width:220px;height:10px;background:#ffffff18;border-radius:8px;overflow:hidden}.health i{display:block;height:100%;background:#55ef8b}.hotbar{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);display:flex;padding:6px;background:#07101de8;border:1px solid #ffffff28;border-radius:14px;pointer-events:auto}.slot{width:78px;height:67px;margin:2px;border:1px solid #ffffff18;border-radius:9px;background:#ffffff08;color:#fff;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}.slot.active{border:2px solid white;background:#ffffff19;box-shadow:0 0 20px #5de5ff44}.slot.locked{opacity:.3}.num{position:absolute;top:4px;left:6px;font-size:10px;opacity:.6}.slot span:last-child{font-size:9px;font-weight:900}.cross{position:fixed;z-index:4;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:white}.cross:before{left:10px;width:2px;height:22px}.cross:after{top:10px;width:22px;height:2px}.ammo{position:fixed;z-index:4;bottom:99px;left:50%;transform:translateX(-50%);font-weight:900}.tip{position:fixed;z-index:4;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.45;white-space:nowrap}.toast{position:fixed;z-index:30;top:16%;left:50%;transform:translateX(-50%);background:#091522ee;border:1px solid #ffffff25;border-radius:12px;padding:12px 18px;font-weight:900;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.logo{font-size:48px}.slot{width:58px}}
</style></head><body><canvas id="game"></canvas><div id="hud" class="hud hide"><div class="top"><b style="font-size:24px;letter-spacing:4px">PVP</b><div><div id="score" class="score">000000</div><div class="health"><i id="hp"></i></div></div></div><div id="hotbar" class="hotbar"></div><div id="ammo" class="ammo"></div><div class="tip">WASD / ARROWS · SHIFT SPRINT · SPACE DASH · CLICK FIRE · R RELOAD · 1 2 3</div><div class="cross"></div></div><section id="home" class="screen"><div class="panel"><div class="logo">PVP</div><div class="tag">ARENA RUSH</div><div class="nav"><button class="btn primary" data-action="play">PLAY</button><button class="btn" data-action="shop">SHOP</button></div><div id="homeContent"></div></div></section><section id="shop" class="screen hide"><div class="panel"><div class="logo" style="font-size:48px">SHOP</div><p class="muted" style="text-align:center">Spend coins earned from kills. Purchases save automatically.</p><div id="shopGrid" class="cards"></div><div style="text-align:center;margin-top:20px"><button class="btn" data-action="home">BACK HOME</button></div></div></section><div id="toast" class="toast"></div><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const weapons={1:{name:'VOLT SMG',icon:'⚡',damage:10,rate:150,max:18,cost:0,color:'#55e5ff'},2:{name:'BLAZE',icon:'🔥',damage:25,rate:480,max:6,cost:250,color:'#ff9855'},3:{name:'SHOCK',icon:'✦',damage:50,rate:850,max:3,cost:650,color:'#c888ff'}};let owned={1:true,2:false,3:false},level={1:0,2:0,3:0},coins=0,best=0,selected=1,ammo=18,reload=0,running=false,score=0,player,enemies=[],bullets=[],parts=[],walls=[],pickups=[],spawn=0,dashCD=0,keys=new Set(),mouse={x:W/2,y:H/2,down:false},cam={x:0,y:0},world={w:5000,h:3500};
try{let s=JSON.parse(localStorage.getItem('pvpSave'));if(s){owned=Object.assign(owned,s.owned);level=Object.assign(level,s.level);coins=s.coins||0;best=s.best||0}}catch(e){}function save(){localStorage.setItem('pvpSave',JSON.stringify({owned,level,coins,best}))}function st(id){let w=weapons[id],l=level[id];return{damage:w.damage+l*6,rate:Math.max(65,w.rate-l*15),max:w.max+l*2,speed:id==1?16:id==2?13:10}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.getElementById('hud').classList.add('hide');running=false}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1100)}
function home(){show('home');document.getElementById('homeContent').innerHTML='<div class="grid"><div class="box"><h2>ENTER THE ARENA</h2><p class="muted">Fight slower enemy waves across a huge scrolling map. Use cover, collect drops and build a streak.</p><button class="btn primary" data-action="play" style="width:100%">ENTER ARENA</button></div><div class="box"><h2>PROFILE</h2><div class="stats"><div class="stat"><span class="muted">COINS</span><b>🪙 '+coins+'</b></div><div class="stat"><span class="muted">BEST</span><b>'+best+'</b></div></div></div></div><div class="box" style="margin-top:14px"><h2>ARSENAL</h2><div class="cards">'+Object.keys(weapons).map(id=>'<div class="card"><div class="icon">'+weapons[id].icon+'</div><h3>'+weapons[id].name+'</h3><div class="muted">'+(owned[id]?'LEVEL '+(level[id]+1)+' · '+st(id).damage+' DAMAGE':'LOCKED')+'</div></div>').join('')+'</div></div>';bindButtons()}
function shop(){show('shop');renderShop()}function renderShop(){document.getElementById('shopGrid').innerHTML=Object.keys(weapons).map(id=>{let w=weapons[id],s=st(id),ownedNow=owned[id],cost=ownedNow?100+level[id]*125:w.cost;return '<div class="card"><div class="icon">'+w.icon+'</div><h3>'+w.name+'</h3><p class="muted">'+(ownedNow?'Level '+(level[id]+1)+'<br>Damage '+s.damage+' · Mag '+s.max:'Locked weapon')+'</p><button class="btn primary" data-buy="'+id+'">'+(ownedNow?'UPGRADE · 🪙 '+cost:'BUY · 🪙 '+cost)+'</button></div>'}).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let id=+b.dataset.buy,w=weapons[id],cost=owned[id]?100+level[id]*125:w.cost;if(coins<cost)return toast('Not enough coins');coins-=cost;if(owned[id])level[id]++;else owned[id]=true;save();renderShop();toast(owned[id]&&level[id]?'Upgrade complete!':'Weapon unlocked!')})}
function bindButtons(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='play')start();if(a==='shop')shop();if(a==='home')home()})}bindButtons();home();
function start(){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hide'));document.getElementById('hud').classList.remove('hide');running=true;score=0;player={x:world.w/2,y:world.h/2,r:18,hp:100,last:0};cam={x:0,y:0};ammo=st(selected).max;reload=0;dashCD=0;enemies=[];bullets=[];parts=[];pickups=[];walls=[];spawn=900;for(let i=0;i<28;i++){let x=200+Math.random()*(world.w-400),y=200+Math.random()*(world.h-400);if(Math.hypot(x-player.x,y-player.y)>500)walls.push({x,y,w:100+Math.random()*180,h:24+Math.random()*45})}for(let i=0;i<4;i++)spawnEnemy();updateHotbar();sync()}
function spawnEnemy(){let side=Math.floor(Math.random()*4),x=side===0?40:side===1?world.w-40:Math.random()*world.w,y=side===2?40:side===3?world.h-40:Math.random()*world.h;if(Math.hypot(x-player.x,y-player.y)<700)return;let tank=Math.random()<.08;enemies.push({x,y,r:tank?23:15,hp:tank?90:35,max:tank?90:35,speed:tank?.42:.55,cd:1800+Math.random()*1300,tank})}
function solid(x,y,r){return walls.some(w=>x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)}function lineBlocked(a,b){let n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/10);for(let i=1;i<=n;i++){let t=i/n;if(solid(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,2))return true}return false}function equip(id){if(!owned[id])return toast('Buy this weapon in the Shop');selected=id;ammo=st(id).max;reload=0;updateHotbar();sync()}function updateHotbar(){document.getElementById('hotbar').innerHTML=Object.keys(weapons).map(id=>'<button class="slot '+(+id===selected?'active ':'')+(owned[id]?'':'locked')+'" data-equip="'+id+'"><span class="num">'+id+'</span><span style="font-size:25px">'+weapons[id].icon+'</span><span>'+ (owned[id]?weapons[id].name:'LOCKED')+'</span></button>').join('');document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>equip(+b.dataset.equip))}
addEventListener('keydown',e=>{keys.add(e.code);keys.add(e.key.toLowerCase());if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')dash();if(e.key.toLowerCase()==='r')startReload();if('123'.includes(e.key))equip(+e.key)});addEventListener('keyup',e=>{keys.delete(e.code);keys.delete(e.key.toLowerCase())});addEventListener('blur',()=>keys.clear());addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});
function startReload(){if(!reload&&ammo<st(selected).max)reload=650}function burst(x,y,c,n=10){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=1+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:250+Math.random()*350,c})}}function dash(){if(!running||dashCD>0)return;let dx=(keys.has('KeyD')||keys.has('d')?1:0)-(keys.has('KeyA')||keys.has('a')?-1:0),dy=(keys.has('KeyS')||keys.has('s')?1:0)-(keys.has('KeyW')||keys.has('w')?-1:0);if(!dx&&!dy)return;let l=Math.hypot(dx,dy);for(let i=0;i<15;i++){let nx=player.x+dx/l*12,ny=player.y+dy/l*12;if(solid(nx,ny,player.r))break;player.x=nx;player.y=ny}dashCD=900;burst(player.x,player.y,'#fff',18)}function shoot(){let s=st(selected),now=performance.now();if(reload||ammo<=0||now-player.last<s.rate)return;player.last=now;ammo--;let a=Math.atan2(mouse.y+cam.y-player.y,mouse.x+cam.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*s.speed,vy:Math.sin(a)*s.speed,damage:s.damage,life:1200,c:weapons[selected].color,enemy:false});burst(player.x,player.y,weapons[selected].color,5);if(!ammo)startReload();sync()}
function update(dt){if(!running)return;let dx=(keys.has('KeyD')||keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('a')||keys.has('ArrowLeft')?1:0),dy=(keys.has('KeyS')||keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('w')||keys.has('ArrowUp')?1:0);if(dx||dy){let l=Math.hypot(dx,dy),sp=keys.has('ShiftLeft')||keys.has('ShiftRight')?4.8:3.2,nx=player.x+dx/l*sp*dt/16,ny=player.y+dy/l*sp*dt/16;if(!solid(nx,player.y,player.r))player.x=nx;if(!solid(player.x,ny,player.r))player.y=ny}if(mouse.down)shoot();if(reload){reload-=dt;if(reload<=0){reload=0;ammo=st(selected).max}}dashCD=Math.max(0,dashCD-dt);for(let b of bullets){b.x+=b.vx*dt/16;b.y+=b.vy*dt/16;b.life-=dt;if(solid(b.x,b.y,2)){b.life=0;burst(b.x,b.y,b.c,5);continue}if(!b.enemy){for(let e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5&&b.life>0){b.life=0;e.hp-=b.damage;if(e.hp<=0){score+=e.tank?250:100;coins+=e.tank?30:12;if(Math.random()<.12)pickups.push({x:e.x,y:e.y,t:'heal',life:8000});burst(e.x,e.y,'#ff5d8f',25);enemies.splice(enemies.indexOf(e),1);save();break}}}}else if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+5){b.life=0;player.hp-=b.damage;burst(player.x,player.y,'#ff5577',8)}}bullets=bullets.filter(b=>b.life>0);for(let e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x),d=Math.hypot(player.x-e.x,player.y-e.y),nx=e.x+Math.cos(a)*e.speed*dt/16,ny=e.y+Math.sin(a)*e.speed*dt/16;if(!solid(nx,e.y,e.r))e.x=nx;if(!solid(e.x,ny,e.r))e.y=ny;e.cd-=dt;if(d<e.r+player.r)player.hp-=.08*dt/16;if(e.cd<=0&&d<700&&!lineBlocked(e,player)){e.cd=1800+Math.random()*1000;bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,damage:e.tank?8:5,life:1600,c:'#ff5577',enemy:true})}}for(let p of pickups){p.life-=dt;if(Math.hypot(p.x-player.x,p.y-player.y)<28){player.hp=Math.min(100,player.hp+25);p.life=0;burst(p.x,p.y,'#5cff96',16)}}pickups=pickups.filter(p=>p.life>0);for(let p of parts){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vx*=.97;p.vy*=.97;p.life-=dt}parts=parts.filter(p=>p.life>0);spawn-=dt;if(spawn<=0){if(enemies.length<Math.min(12,4+Math.floor(score/300)))spawnEnemy();spawn=900}cam.x=Math.max(0,Math.min(world.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,player.y-H/2));if(player.hp<=0){running=false;best=Math.max(best,score);save();home()}sync()}
function sync(){if(!player)return;document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('hp').style.width=Math.max(0,player.hp)+'%';document.getElementById('ammo').textContent=reload?'RELOADING':ammo+' / '+st(selected).max}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#122b46');g.addColorStop(1,'#050b13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.strokeStyle='#ffffff0b';for(let x=0;x<world.w;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}for(let w of walls){ctx.fillStyle='#172d43';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle='#4c86a5';ctx.strokeRect(w.x,w.y,w.w,w.h)}for(let p of pickups){ctx.fillStyle='#5cff96';ctx.shadowBlur=18;ctx.shadowColor='#5cff96';ctx.beginPath();ctx.arc(p.x,p.y,12,0,7);ctx.fill();ctx.shadowBlur=0}for(let b of bullets){ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}for(let e of enemies){ctx.fillStyle=e.tank?'#e24463':'#ff4f91';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#61ff8c';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.max),4)}if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.atan2(mouse.y+cam.y-player.y,mouse.x+cam.x-player.x));ctx.fillStyle=weapons[selected].color;ctx.shadowBlur=20;ctx.shadowColor=weapons[selected].color;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(8,-4,28,8);ctx.restore()}for(let p of parts){ctx.globalAlpha=Math.max(0,p.life/400);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;ctx.restore()}
let last=performance.now();function loop(t){let dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
