<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVP Arena Rush</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;cursor:crosshair}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:20px;left:22px;right:22px;display:flex;justify-content:space-between}.brand{font-size:27px;font-weight:900;letter-spacing:5px}.brand small{display:block;font-size:9px;letter-spacing:3px;opacity:.5;margin-top:3px}.score{text-align:right;font-size:27px;font-weight:900}.hp{width:220px;height:10px;background:#ffffff20;border-radius:20px;overflow:hidden;margin-top:7px}.hp i{display:block;height:100%;width:100%;background:#59f28a}.weapon{position:absolute;bottom:20px;left:22px;min-width:285px;padding:15px 18px;border-radius:16px;background:#0b1320e8;border:1px solid #ffffff22;box-shadow:0 12px 40px #0008}.weapon b{font-size:19px}.ammo{float:right;font-size:25px;font-weight:900}.tips{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.55;text-align:center;white-space:nowrap}.cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{left:9px;width:2px;height:20px}.cross:after{top:9px;height:2px;width:20px}.menu{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at center,#1a3150,#05080eee 70%)}.card{width:min(540px,90vw);padding:45px;text-align:center;border:1px solid #ffffff25;border-radius:28px;background:#091321f5;box-shadow:0 30px 100px #000}.card h1{font-size:64px;margin:0;background:linear-gradient(90deg,#54e5ff,#9b7cff,#ff5c9d);color:transparent;background-clip:text}.card p{opacity:.62;line-height:1.6}.play{border:0;border-radius:13px;padding:16px 35px;font-weight:900;cursor:pointer;font-size:15px}.hidden{display:none}</style></head><body>
<canvas id="game"></canvas><div class="hud"><div class="top"><div class="brand">PVP<small>ARENA RUSH</small></div><div><div class="score" id="score">000000</div><div class="hp"><i id="hp"></i></div></div></div><div class="cross"></div><div class="weapon"><span class="ammo" id="ammo">14</span><b id="gun">VOLT SMG</b><div id="info" style="opacity:.5;font-size:11px;margin-top:4px">Rapid fire</div></div><div class="tips">WASD MOVE · SHIFT SPRINT · MOUSE AIM · CLICK FIRE · SPACE DASH · R RELOAD · 1 2 3 WEAPONS</div></div>
<div class="menu" id="menu"><div class="card"><h1 id="title">PVP</h1><p id="desc">Enter the arena. Fight waves of enemies, dodge projectiles, grab power-ups and build your score.</p><button class="play" id="play">ENTER ARENA</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();dash()}if(e.key.toLowerCase()==='r')reload();if('123'.includes(e.key))equip(+e.key)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let mouse={x:W/2,y:H/2,down:false};addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
const guns={1:{name:'VOLT SMG',damage:12,rate:95,max:14,speed:15,color:'#59e5ff',info:'Fast fire · 12 damage'},2:{name:'BLAZE BLASTER',damage:35,rate:420,max:6,speed:12,color:'#ff9b57',info:'Heavy hit · 35 damage'},3:{name:'SHOCKWAVE',damage:70,rate:800,max:3,speed:9,color:'#c78cff',info:'Devastating · 70 damage'}};let gun=1,ammo=14,reloading=0,running=false,score=0,player,enemies=[],bullets=[],particles=[],pickups=[],spawnTimer=0,dashTimer=0,walls=[];
function reset(){score=0;ammo=guns[gun].max;reloading=0;spawnTimer=300;dashTimer=0;enemies=[];bullets=[];particles=[];pickups=[];player={x:W/2,y:H/2,r:18,hp:100,last:0};walls=[{x:W*.17,y:H*.23,w:190,h:24},{x:W*.66,y:H*.23,w:190,h:24},{x:W*.26,y:H*.7,w:230,h:24},{x:W*.72,y:H*.66,w:150,h:24},{x:W*.48,y:H*.43,w:100,h:70}];for(let i=0;i<5;i++)spawnEnemy()}
function spawnEnemy(){let side=Math.floor(Math.random()*4),x=side===2?-35:side===3?W+35:Math.random()*W,y=side===0?-35:side===1?H+35:Math.random()*H;let tank=Math.random()<.2;enemies.push({x,y,r:tank?23:16,hp:tank?100:45,max:tank?100:45,speed:tank?.65:1.2+Math.random()*.6,cd:500+Math.random()*700,tank})}
function equip(n){gun=n;ammo=Math.min(ammo,guns[n].max);document.getElementById('gun').textContent=guns[n].name;document.getElementById('info').textContent=guns[n].info;sync()}
function reload(){if(!reloading&&ammo<guns[gun].max)reloading=650}
function sync(){document.getElementById('ammo').textContent=reloading?'RELOADING':ammo;document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('hp').style.width=Math.max(0,player?player.hp:100)+'%'}
function burst(x,y,c,n=10){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=Math.random()*4+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:250+Math.random()*400,c})}}
function dash(){if(!running||dashTimer>0)return;let dx=keys.d-keys.a,dy=keys.s-keys.w,l=Math.hypot(dx,dy)||1;player.x=Math.max(25,Math.min(W-25,player.x+dx/l*140));player.y=Math.max(25,Math.min(H-25,player.y+dy/l*140));dashTimer=900;burst(player.x,player.y,'#fff',20)}
function shoot(){let g=guns[gun],now=performance.now();if(reloading||ammo<=0||now-player.last<g.rate)return;player.last=now;ammo--;let a=Math.atan2(mouse.y-player.y,mouse.x-player.x)+(Math.random()-.5)*.07;bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*g.speed,vy:Math.sin(a)*g.speed,damage:g.damage,life:900,c:g.color,enemy:false});burst(player.x+Math.cos(a)*22,player.y+Math.sin(a)*22,g.color,5);if(!ammo)reload();sync()}
function update(dt){if(!running)return;let sp=keys.shift?5.2:3.5,dx=keys.d-keys.a,dy=keys.s-keys.w;if(dx||dy){let l=Math.hypot(dx,dy);player.x+=dx/l*sp*dt/16;player.y+=dy/l*sp*dt/16}player.x=Math.max(24,Math.min(W-24,player.x));player.y=Math.max(24,Math.min(H-24,player.y));if(mouse.down)shoot();dashTimer=Math.max(0,dashTimer-dt);if(reloading){reloading-=dt;if(reloading<=0){ammo=guns[gun].max;reloading=0}}for(const b of bullets){b.x+=b.vx*dt/16;b.y+=b.vy*dt/16;b.life-=dt;if(!b.enemy){for(const e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+6&&b.life>0){b.life=0;e.hp-=b.damage;burst(b.x,b.y,b.c,8);if(e.hp<=0){score+=e.tank?250:100;burst(e.x,e.y,e.tank?'#ff5368':'#58e5ff',30);if(Math.random()<.18)pickups.push({x:e.x,y:e.y,type:Math.random()<.5?'heal':'ammo',life:9000});enemies.splice(enemies.indexOf(e),1);sync();break}}}}else if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+5){b.life=0;player.hp-=b.damage;burst(player.x,player.y,'#ff5577',10)}}bullets=bullets.filter(b=>b.life>0&&b.x>-60&&b.x<W+60&&b.y>-60&&b.y<H+60);
for(const e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x),d=Math.hypot(player.x-e.x,player.y-e.y);e.x+=Math.cos(a)*e.speed*dt/16;e.y+=Math.sin(a)*e.speed*dt/16;e.cd-=dt;if(d<e.r+player.r)player.hp-=.16*dt/16;if(e.cd<=0&&d<650){e.cd=900+Math.random()*900;let aa=a+(Math.random()-.5)*.16;bullets.push({x:e.x,y:e.y,vx:Math.cos(aa)*6.5,vy:Math.sin(aa)*6.5,damage:e.tank?12:7,life:1800,c:'#ff5277',enemy:true})}}
for(const p of pickups){p.life-=dt;if(Math.hypot(p.x-player.x,p.y-player.y)<30){if(p.type==='heal')player.hp=Math.min(100,player.hp+30);else ammo=guns[gun].max;p.life=0;burst(p.x,p.y,p.type==='heal'?'#61ff98':'#ffd35c',18)}}pickups=pickups.filter(p=>p.life>0);spawnTimer-=dt;if(spawnTimer<=0&&enemies.length<Math.min(18,5+Math.floor(score/300))){spawnEnemy();spawnTimer=Math.max(250,700-score/4)}for(const p of particles){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vx*=.97;p.vy*=.97;p.life-=dt}particles=particles.filter(p=>p.life>0);sync();if(player.hp<=0){running=false;document.getElementById('title').textContent='DEFEATED';document.getElementById('desc').innerHTML='Final score: <b>'+score+'</b><br>Jump back in and beat it.';document.getElementById('play').textContent='PLAY AGAIN';document.getElementById('menu').classList.remove('hidden')}}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.8);bg.addColorStop(0,'#18395b');bg.addColorStop(1,'#050910');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff10';for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const w of walls){ctx.fillStyle='#14263a';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle='#4d87a8';ctx.strokeRect(w.x,w.y,w.w,w.h)}for(const p of pickups){ctx.fillStyle=p.type==='heal'?'#61ff98':'#ffd35c';ctx.shadowBlur=20;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,12+Math.sin(performance.now()/100)*3,0,6.28);ctx.fill();ctx.shadowBlur=0}for(const b of bullets){ctx.fillStyle=b.c;ctx.shadowBlur=15;ctx.shadowColor=b.c;ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.28);ctx.fill();ctx.shadowBlur=0}for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.atan2(player.y-e.y,player.x-e.x));ctx.fillStyle=e.tank?'#e04360':'#ff4f93';ctx.shadowBlur=20;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.moveTo(e.r+7,0);ctx.lineTo(-e.r*.7,-e.r*.8);ctx.lineTo(-e.r*.7,e.r*.8);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(2,-3,10,6);ctx.restore();ctx.fillStyle='#0009';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle='#62ff8d';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*(e.hp/e.max),4)}if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.atan2(mouse.y-player.y,mouse.x-player.x));ctx.shadowBlur=25;ctx.shadowColor=guns[gun].color;ctx.fillStyle='#d7e7f5';ctx.beginPath();ctx.arc(0,0,18,0,6.28);ctx.fill();ctx.fillStyle='#24344b';ctx.fillRect(-10,-12,18,24);ctx.fillStyle=guns[gun].color;ctx.fillRect(7,-4,27,8);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/500);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1}
let last=performance.now();function loop(t){let dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}document.getElementById('play').onclick=()=>{document.getElementById('menu').classList.add('hidden');document.getElementById('title').textContent='PVP';document.getElementById('desc').textContent='Enter the arena. Fight waves of enemies, dodge projectiles, grab power-ups and build your score.';document.getElementById('play').textContent='ENTER ARENA';reset();running=true;sync()};equip(1);requestAnimationFrame(loop);
</script></body></html>
